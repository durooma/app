{{define "content"}}
<div class="page-head"><div><p class="eyebrow">Organization</p><h1>Categories</h1><p class="page-description">Bring structure to your spending and income.</p></div></div>
<p class="muted">Edit names, descriptions and type. Descriptions are also used as
context for the AI categorizer.</p>

<div class="table-scroll">
<table class="editable">
	<thead><tr><th>Name</th><th>Description</th><th>Type</th><th class="num">Sort</th><th><span class="sr-only">Actions</span></th></tr></thead>
	<tbody>
		{{range .Categories}}
		<tr>
			<td>
				<form id="cat-{{.ID}}" method="post" action="/categories/{{.ID}}"></form>
				<input form="cat-{{.ID}}" aria-label="Category name" name="name" value="{{.Name}}" required>
			</td>
			<td><input form="cat-{{.ID}}" aria-label="Category description" name="description" value="{{.Description}}" class="wide"></td>
			<td>
				<select form="cat-{{.ID}}" aria-label="Category type" name="kind">
					<option value="" {{if eq .Kind ""}}selected{{end}}>—</option>
					<option value="income" {{if eq .Kind "income"}}selected{{end}}>Income</option>
					<option value="expense" {{if eq .Kind "expense"}}selected{{end}}>Expense</option>
				</select>
			</td>
			<td class="num"><input form="cat-{{.ID}}" aria-label="Sort order" name="sort_order" type="number" value="{{.SortOrder}}" class="tiny"></td>
			<td class="nowrap">
				<button form="cat-{{.ID}}" type="submit">Save</button>
				<button form="cat-{{.ID}}" type="submit" formaction="/categories/{{.ID}}/delete" class="del"
					onclick="return confirm('Delete category {{.Name}}?')">Delete</button>
			</td>
		</tr>
		{{end}}
	</tbody>
</table>
</div>

<section class="form-panel"><h2>Add category</h2>
<form method="post" action="/categories" class="row-form">
	<label>Name<input name="name" placeholder="Name" required></label>
	<label>Description<input name="description" placeholder="Description" class="wide"></label>
	<label>Type<select name="kind">
		<option value="">—</option>
		<option value="income">Income</option>
		<option value="expense">Expense</option>
	</select></label>
	<label>Order<input name="sort_order" type="number" placeholder="Sort" class="tiny" value="500"></label>
	<button type="submit">Add category</button>
</form>
</section>
{{end}}
